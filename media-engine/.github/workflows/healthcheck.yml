name: Media Engine Healthcheck

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r media-engine/requirements.txt
      - name: Syntax check
        run: python -m compileall media-engine/src
